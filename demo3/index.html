<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Ngai Quỷ Vương</title>
  <meta name="description" content="Demo ARPG 3D low-poly với asset Quaternius (CC0) — game-r demo3">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
</head>
<body>
  <div id="app"></div>
  <div id="vignette"></div>
  <div id="hurt"></div>
  <div id="world-ui"></div>

  <header class="hud" id="hud-tl">
    <div class="portrait"><img id="portrait" alt=""><span class="lvl" id="lvl">1</span></div>
    <div class="vitals">
      <div class="name" id="hero-name">Chiến Binh</div>
      <div class="bar hp"><i id="hp-fill"></i><b id="hp-txt">100/100</b></div>
      <div class="bar mp"><i id="mp-fill"></i><b id="mp-txt">50/50</b></div>
      <div class="bar xp"><i id="xp-fill"></i></div>
    </div>
  </header>

  <aside class="hud" id="hud-tr">
    <div class="glass mini-wrap"><canvas id="minimap" width="156" height="108" aria-label="Bản đồ"></canvas></div>
    <div class="glass quest" id="quest" hidden>
      <div class="q-title" id="q-title"></div>
      <div class="q-step" id="q-step"></div>
    </div>
    <div class="heroes" id="heroes" aria-label="Chọn nhân vật"></div>
  </aside>

  <div class="hud" id="hud-top">
    <div class="boss" id="boss" hidden>
      <div class="boss-name" id="boss-name">Quỷ Vương</div>
      <div class="bar boss-bar"><i id="boss-fill"></i></div>
    </div>
    <div class="banner" id="banner"></div>
  </div>

  <div class="hud" id="hud-bl">
    <button class="pill" id="b-bag"><span class="gold-dot"></span><span id="gold">0</span><span class="sep"></span>Túi đồ <kbd>I</kbd></button>
  </div>

  <div class="hud" id="skills">
    <button class="sk sk-main" id="sk-atk" aria-label="Tấn công"><span class="ico" id="ico-atk"></span><kbd>J</kbd></button>
    <button class="sk" id="sk-q" aria-label="Kỹ năng"><span class="ico" id="ico-q"></span><span class="cd"></span><kbd>Q</kbd><em>20</em></button>
    <button class="sk" id="sk-e" aria-label="Lăn né"><span class="ico ico-dash"></span><span class="cd"></span><kbd>Space</kbd></button>
    <button class="sk" id="sk-r" aria-label="Bình máu"><span class="ico" id="ico-r"></span><span class="cd"></span><kbd>R</kbd><em id="pot-n">3</em></button>
  </div>

  <button class="talk" id="talk" hidden>Nói chuyện <kbd>F</kbd></button>
  <div id="joy" hidden><div id="joy-knob"></div></div>
  <div id="toasts" aria-live="polite"></div>
  <div class="hint" id="hint">WASD / cần gạt để chạy · click quái hoặc <b>J</b> để đánh · <b>Q</b> kỹ năng · <b>Space</b> lăn né · <b>R</b> bình máu · <b>F</b> nói chuyện · <b>1-3</b> đổi nhân vật</div>

  <div class="modal" id="dialog" hidden>
    <div class="dlg glass">
      <img class="dlg-face" id="dlg-face" alt="">
      <div class="dlg-body">
        <div class="dlg-name" id="dlg-name"></div>
        <p class="dlg-text" id="dlg-text"></p>
        <div class="dlg-acts" id="dlg-acts"></div>
      </div>
    </div>
  </div>

  <div class="modal center" id="inv" hidden>
    <div class="panel glass" role="dialog" aria-label="Túi đồ">
      <div class="panel-head"><h2>Túi đồ</h2><button class="x" data-close aria-label="Đóng">✕</button></div>
      <div class="inv">
        <div>
          <div class="lbl">Đang trang bị</div>
          <div class="equip" id="equip"></div>
          <div class="lbl">Hành trang</div>
          <div class="grid" id="bag"></div>
          <dl class="stats" id="stats"></dl>
        </div>
        <div class="detail" id="detail"></div>
      </div>
    </div>
  </div>

  <div id="loading">
    <div class="ld-title">Ngai Quỷ Vương</div>
    <div class="ld-bar"><i id="ld-fill"></i></div>
    <div class="ld-txt" id="ld-txt">Đang tải mô hình 3D…</div>
    <div class="ld-credit">Asset: Quaternius · CC0</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
