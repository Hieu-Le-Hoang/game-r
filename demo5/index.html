<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>Hầm Mộ Ardwen</title>
  <meta name="description" content="Demo ARPG 2.5D isometric kiểu Diablo II, art Flare (CC-BY-SA 3.0) — game-r demo5">
  <link rel="icon" type="image/webp" href="./a/portraits/male01.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
</head>
<body>
  <div id="app"></div>

  <div id="hud">
    <div class="orb hp" id="orb-hp" title="Máu"><i id="hp-fill"></i><b id="hp-txt"></b></div>
    <div class="belt">
      <div class="xp"><i id="xp-fill"></i></div>
      <div class="bar">
        <button class="sk" id="sk-atk" aria-label="Tấn công"><span class="ic" data-ic="1"></span><kbd>Chuột</kbd></button>
        <button class="sk" id="sk-q" aria-label="Cầu lửa"><span class="ic" data-ic="18"></span><span class="cd"></span><kbd>Q</kbd><em>8</em></button>
        <button class="sk" id="sk-w" aria-label="Động đất"><span class="ic" data-ic="39"></span><span class="cd"></span><kbd>W</kbd><em>18</em></button>
        <button class="sk" id="sk-e" aria-label="Hồi phục"><span class="ic" data-ic="11"></span><span class="cd"></span><kbd>E</kbd><em>15</em></button>
        <button class="sk" id="sk-r" aria-label="Bình máu"><span class="ic" data-ic="64"></span><span class="cd"></span><kbd>R</kbd><em id="pot-n" class="n">3</em></button>
      </div>
    </div>
    <div class="orb mp" id="orb-mp" title="Mana"><i id="mp-fill"></i><b id="mp-txt"></b></div>
  </div>

  <div id="top">
    <div class="lvl-tag">Cấp <b id="lvl">1</b> · <span id="gold">0</span> vàng</div>
    <button class="ghost" id="b-inv">Hành trang <kbd>I</kbd></button>
  </div>
  <div id="boss" hidden><div class="boss-name" id="boss-name"></div><div class="boss-bar"><i id="boss-fill"></i></div></div>
  <div id="quest" hidden></div>
  <div id="banner"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="joy" hidden><div id="joy-knob"></div></div>
  <div id="tip" hidden></div>
  <div class="hint" id="hint">Click để đi · click quái để đánh · chuột phải hoặc <b>Q</b> cầu lửa · <b>W</b> động đất · <b>E</b> hồi phục · <b>R</b> bình máu · <b>I</b> hành trang</div>

  <div class="modal" id="dialog" hidden>
    <div class="dlg stone">
      <img class="dlg-face" id="dlg-face" alt="">
      <div class="dlg-body">
        <div class="dlg-name" id="dlg-name"></div>
        <p class="dlg-text" id="dlg-text"></p>
        <div class="dlg-acts" id="dlg-acts"></div>
      </div>
    </div>
  </div>

  <div class="modal center" id="inv" hidden>
    <div class="panel stone" role="dialog" aria-label="Hành trang">
      <div class="panel-head"><h2>Hành Trang</h2><button class="x" data-close aria-label="Đóng">✕</button></div>
      <div class="inv">
        <div class="doll" id="doll"></div>
        <div class="detail" id="detail"></div>
      </div>
      <div class="grid" id="bag"></div>
      <dl class="stats" id="stats"></dl>
    </div>
  </div>

  <div id="loading">
    <div class="ld-title">Hầm Mộ Ardwen</div>
    <div class="ld-bar"><i id="ld-fill"></i></div>
    <div class="ld-txt" id="ld-txt">Đang thắp đuốc…</div>
    <div class="ld-credit">Art: Flare – Empyrean Campaign (CC-BY-SA 3.0)</div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
